<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E2A44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gastos">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<title>Gastos</title>
<style>
:root{--bg:#EEF1F8;--card:#fff;--ink:#1E2A44;--mut:#64748B;--line:#E2E8F0;--ind:#4F46E5;--r:18px;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
@media(prefers-color-scheme:dark){:root{--bg:#0F172A;--card:#1E293B;--ink:#F1F5F9;--mut:#94A3B8;--line:#334155}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Roboto,system-ui,-apple-system,sans-serif}
#app{max-width:760px;margin:0 auto;padding-bottom:calc(84px + var(--sab))}
header{background:#1E2A44;color:#fff;padding:calc(14px + var(--sat)) 18px 56px;border-radius:0 0 28px 28px}
header .top{display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:18px;font-weight:600}
.ib{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:12px;width:38px;height:38px;font-size:17px}
.month{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px}
.month b{font-size:17px;min-width:150px;text-align:center}
.month button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:50%;width:34px;height:34px;font-size:16px}
main{padding:0 14px;margin-top:-38px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.card h2{margin:0 0 10px;font-size:14px;color:var(--mut);font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.total{font-size:36px;font-weight:700;letter-spacing:-1px}
.sub{color:var(--mut);font-size:13px}
.delta{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;margin-left:6px}
.up{background:#FEE2E2;color:#B91C1C}.dn{background:#DCFCE7;color:#166534}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{flex:1;min-width:100px;border-radius:14px;padding:10px 12px}
.chip small{display:block;font-size:11px;font-weight:600;opacity:.85}.chip b{font-size:17px}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;margin-top:12px;background:var(--line)}
.donutw{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.donut{position:relative;width:170px;height:170px}
.donut svg{transform:rotate(-90deg)}
.donut .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut .mid b{font-size:20px}
.leg{flex:1;min-width:160px}
.leg div{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:8px;cursor:pointer}
.leg div:active{background:var(--line)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.leg span.n{flex:1}.leg span.v{font-weight:600}.leg span.p{color:var(--mut);width:38px;text-align:right;font-size:12px}
.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.brow{padding:10px 0;border-top:1px solid var(--line)}.brow:first-of-type{border:0}
.brow .l{display:flex;justify-content:space-between;margin-bottom:6px}
input[type=search],input[type=text],input[type=password]{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:11px 14px;font-size:15px;margin-bottom:10px}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.fchips button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;font-size:13px}
.fchips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day{font-size:12px;font-weight:600;color:var(--mut);margin:14px 4px 6px;text-transform:uppercase}
.mv{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--card);border-radius:14px;margin-bottom:6px;width:100%;border:0;color:inherit;text-align:left;font:inherit}
.mv .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.mv .t{flex:1;min-width:0}.mv .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .t small{color:var(--mut)}.mv .a{font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + var(--sab));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:6px 0;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}nav button.on{color:var(--ind)}
.sheet{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);width:100%;max-width:760px;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + var(--sab));max-height:80vh;overflow:auto}
.sheet h3{margin:0 0 4px}.opt{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.opt button{border:0;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600}
.btn{background:var(--ind);color:#fff;border:0;border-radius:14px;padding:12px 18px;font-size:15px;font-weight:600;width:100%}
.note{font-size:12px;color:var(--mut);margin:8px 2px}
.demo{background:#FEF3C7;color:#92400E;border-radius:12px;padding:8px 12px;font-size:12px;margin-bottom:12px}
.empty{text-align:center;color:var(--mut);padding:30px 0}
</style></head><body><div id="app"></div>
<nav id="nav"></nav><div id="modal"></div>
<script src="app.js"></script>
</body></html>
